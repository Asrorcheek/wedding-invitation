<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#edc1b4" />
    <meta name="description" content="Azizbek va Malikaning eng go‘zal kuniga taklifnoma." />
    <meta property="og:title" content="Azizbek & Malika — Taklifnoma" />
    <meta property="og:description" content="15-oktabr 2026 · Atlas Plaza" />
    <meta property="og:image" content="assets/invitation.png" />
    <title>Azizbek & Malika — Taklifnoma</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="experience" id="experience">
      <div class="ambient ambient-one" aria-hidden="true"></div>
      <div class="ambient ambient-two" aria-hidden="true"></div>

      <section class="invitation-shell" aria-label="To‘y taklifnomasi">
        <div class="invitation-card">
          <img
            class="invitation-image"
            src="assets/invitation.png"
            alt="Azizbek va Malikaning 2026-yil 15-oktabrdagi to‘y taklifnomasi"
          />
          <div class="glow" aria-hidden="true"></div>
          <div class="petal-field" id="petals" aria-hidden="true"></div>

          <button class="cover-button" id="openInvitation" type="button" aria-label="Taklifnomani ochish">
            <img class="cover-image" src="assets/cover.png" alt="Taklifnoma — ochish uchun bosing" />
            <span class="tap-ripple" aria-hidden="true"></span>
          </button>
        </div>
        <p class="opening-note" id="openingNote" aria-live="polite">Taklifnomani ochish uchun bosing</p>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
